services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  echo-primary:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:9000", "-text={\"status\":\"ok\",\"upstream\":\"primary\"}"]
    ports:
      - "9001:9000"

  echo-secondary:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:9000", "-text={\"status\":\"ok\",\"upstream\":\"secondary\"}"]
    ports:
      - "9002:9000"

  gateway-1:
    build: .
    image: ghcr.io/chiru9030/distributed-rate-limiter-gateway:v1.0.0
    environment:
      PORT: "8080"
      LISTEN_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      UPSTREAM_URLS: "http://echo-primary:9000|3,http://echo-secondary:9000|1"
      UPSTREAM_STRATEGY: "weighted"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      GATEWAY_DEMO_API_KEY: "${GATEWAY_DEMO_API_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      echo-primary:
        condition: service_started
      echo-secondary:
        condition: service_started

  gateway-2:
    build: .
    image: ghcr.io/chiru9030/distributed-rate-limiter-gateway:v1.0.0
    environment:
      PORT: "8080"
      LISTEN_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      UPSTREAM_URLS: "http://echo-primary:9000|3,http://echo-secondary:9000|1"
      UPSTREAM_STRATEGY: "weighted"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      GATEWAY_DEMO_API_KEY: "${GATEWAY_DEMO_API_KEY:-}"
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
      echo-primary:
        condition: service_started
      echo-secondary:
        condition: service_started
