apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter-gateway
  labels:
    app: distributed-rate-limiter-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: distributed-rate-limiter-gateway
  template:
    metadata:
      labels:
        app: distributed-rate-limiter-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: ghcr.io/chiru9030/distributed-rate-limiter-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rate-limiter-gateway-config
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rate-limiter-gateway-secrets
                  key: ADMIN_API_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rate-limiter-gateway-secrets
                  key: REDIS_PASSWORD
                  optional: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
