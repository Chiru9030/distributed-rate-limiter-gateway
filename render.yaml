services:
  - type: web
    name: distributed-rate-limiter-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: UPSTREAM_STRATEGY
        value: weighted
      - key: ADMIN_API_KEY
        generateValue: true
      - key: GATEWAY_DEMO_API_KEY
        generateValue: true
